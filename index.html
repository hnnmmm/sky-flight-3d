<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Flight 3D · 天空飞行</title>
  <style>
    :root {
      --ink: #eaf4ff;
      --accent: #7ec8ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e3a5f; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      color: var(--ink);
      cursor: crosshair;
      -webkit-user-select: none; user-select: none;
    }
    canvas { display: block; }

    /* HUD 标题 */
    .hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
    }
    .title {
      position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
      text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,0.35);
    }
    .title h1 {
      font-size: clamp(22px, 4vw, 40px); font-weight: 700;
      letter-spacing: 0.08em; background: linear-gradient(180deg, #fff, #9ed4ff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title p { margin-top: 6px; font-size: 13px; opacity: 0.85; letter-spacing: 0.12em; }

    .instruments {
      position: absolute; left: 22px; bottom: 22px;
      display: flex; gap: 14px; align-items: flex-end;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .gauge { min-width: 92px; }
    .gauge .label { font-size: 10px; letter-spacing: 0.18em; opacity: 0.7; text-transform: uppercase; }
    .gauge .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .hint {
      position: absolute; right: 22px; bottom: 22px; text-align: right;
      font-size: 12px; line-height: 1.9; opacity: 0.75; text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .hint b { color: var(--accent); font-weight: 600; }

    .fade {
      position: absolute; top: 0; left: 0; right: 0; height: 90px;
      background: linear-gradient(180deg, rgba(10,20,40,0.35), transparent);
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(5,10,25,0.38) 100%);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="vignette"></div>
    <div class="fade"></div>
    <div class="title">
      <h1>SKY FLIGHT 3D</h1>
      <p>天空飞行 · 穿越云海</p>
    </div>
    <div class="instruments">
      <div class="gauge">
        <div class="label">速度 Speed</div>
        <div class="value" id="speed">0</div>
      </div>
      <div class="gauge">
        <div class="label">高度 Alt</div>
        <div class="value" id="alt">0</div>
      </div>
    </div>
    <div class="hint">
      移动鼠标 <b>操控方向</b><br />
      按住 <b>左键 / 触屏</b> 加速<br />
      松手自动巡航
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- 基础渲染 ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const FOG_COLOR = new THREE.Color(0xbfe3f2);
    scene.fog = new THREE.Fog(FOG_COLOR, 120, 900);

    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 4000
    );

    // ---------- 天空穹顶 ----------
    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 2; c.height = 512;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0.0, '#2b6bb0');
      g.addColorStop(0.45, '#6fb6e6');
      g.addColorStop(0.72, '#cfe9f7');
      g.addColorStop(1.0, '#eef7fb');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 2, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(2800, 32, 18),
      new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
    );
    sky.position.y = -40;
    scene.add(sky);

    // ---------- 光照 ----------
    const sunLight = new THREE.DirectionalLight(0xfff3e0, 2.6);
    sunLight.position.set(300, 520, -180);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -400;
    sunLight.shadow.camera.right = 400;
    sunLight.shadow.camera.top = 400;
    sunLight.shadow.camera.bottom = -400;
    sunLight.shadow.camera.far = 1600;
    scene.add(sunLight);
    scene.add(sunLight.target);

    const hemi = new THREE.HemisphereLight(0xd7ecff, 0x35506b, 0.9);
    scene.add(hemi);

    // 太阳光斑
    const sunGlow = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: makeGlowTexture('#fff6df', '#ffd98a'),
        blending: THREE.AdditiveBlending,
        depthWrite: false, fog: false,
      })
    );
    sunGlow.position.copy(sunLight.position).normalize().multiplyScalar(2400);
    sunGlow.scale.setScalar(700);
    scene.add(sunGlow);

    function makeGlowTexture(inner, outer) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, inner);
      g.addColorStop(0.35, outer);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ---------- 海面 ----------
    const waterGeo = new THREE.PlaneGeometry(6000, 6000, 128, 128);
    waterGeo.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(
      waterGeo,
      new THREE.MeshStandardMaterial({ color: 0x2686bd, roughness: 0.25, metalness: 0.05 })
    );
    water.receiveShadow = true;
    scene.add(water);

    // ---------- 岛屿 ----------
    function seededRand(seed) {
      let t = seed + 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function noise(x, y) {
      const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return n - Math.floor(n);
    }

    function createIsland(cx, cz, radius, peak) {
      const seg = 48;
      const geo = new THREE.PlaneGeometry(radius * 2, radius * 2, seg, seg);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const sand = new THREE.Color(0xd9c188);
      const grass = new THREE.Color(0x4e8a4a);
      const dark = new THREE.Color(0x2f6136);
      const rock = new THREE.Color(0x8a9a92);
      const tmp = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const d = Math.sqrt(x * x + z * z) / radius; // 0 中心 -> 1 边缘
        let h = (1 - d * d) * peak;
        if (h <= 0) h = 0;
        // 加入轻微起伏
        h += (noise(cx + x * 0.04, cz + z * 0.04) - 0.5) * peak * 0.35;
        h = Math.max(0, h);
        pos.setY(i, h);

        const t = d;
        if (h < 2.0) tmp.copy(sand);
        else if (t < 0.35) tmp.copy(grass);
        else if (t < 0.7) tmp.copy(dark);
        else tmp.copy(rock);
        // 根据高度亮暗
        tmp.offsetHSL(0, 0, (h / peak) * 0.06);
        colors[i * 3] = tmp.r;
        colors[i * 3 + 1] = tmp.g;
        colors[i * 3 + 2] = tmp.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.0 })
      );
      mesh.position.set(cx, 0, cz);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      return mesh;
    }

    const islands = [];
    for (let i = 0; i < 10; i++) {
      const a = i * 2.399 + 0.5;
      const r = 300 + i * 90;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      const radius = 90 + seededRand(i + 1) * 160;
      const peak = 40 + seededRand(i + 7) * 70;
      const island = createIsland(x, z, radius, peak);
      scene.add(island);
      islands.push(island);
    }

    // ---------- 云朵 ----------
    const cloudTexture = makeGlowTexture('#ffffff', '#cfe4f5');
    function makeCloud(x, y, z, scale, puffCount) {
      const group = new THREE.Group();
      const mat = new THREE.SpriteMaterial({
        map: cloudTexture, depthWrite: false, transparent: true, fog: true, opacity: 0.92,
      });
      for (let i = 0; i < puffCount; i++) {
        const s = new THREE.Sprite(mat);
        const ox = (seededRand(i * 3 + x * 7) - 0.5) * scale * 1.6;
        const oy = (seededRand(i * 5 + 2) - 0.5) * scale * 0.55;
        const oz = (seededRand(i * 7 + 5) - 0.5) * scale * 1.6;
        const ps = scale * (0.55 + seededRand(i * 11) * 0.7);
        s.position.set(ox, oy, oz);
        s.scale.set(ps, ps, 1);
        group.add(s);
      }
      group.position.set(x, y, z);
      return group;
    }

    const clouds = [];
    for (let i = 0; i < 90; i++) {
      const a = seededRand(i + 3) * Math.PI * 2;
      const r = 200 + seededRand(i + 9) * 1300;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      const y = 130 + seededRand(i + 5) * 260;
      const scale = 24 + seededRand(i + 13) * 46;
      const cloud = makeCloud(x, y, z, scale, 3 + Math.floor(seededRand(i) * 5));
      scene.add(cloud);
      clouds.push(cloud);
    }

    // ---------- 飞机模型 ----------
    const plane = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8eef4, roughness: 0.35, metalness: 0.15 });
    const accentMat = new THREE.MeshStandardMaterial({ color: 0xd23a3a, roughness: 0.4, metalness: 0.1 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x24303d, roughness: 0.4, metalness: 0.2 });

    const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.42, 3.6, 16), bodyMat);
    fuselage.geometry.rotateX(Math.PI / 2);
    fuselage.castShadow = true;
    plane.add(fuselage);

    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 16), darkMat);
    nose.geometry.rotateX(Math.PI / 2);
    nose.position.z = -2.2;
    nose.castShadow = true;
    plane.add(nose);

    const wings = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.12, 1.2), accentMat);
    wings.position.z = 0.3;
    wings.position.y = 0.05;
    wings.castShadow = true;
    plane.add(wings);

    const tailH = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.6), accentMat);
    tailH.position.set(0, 0.1, 1.7);
    tailH.castShadow = true;
    plane.add(tailH);

    const tailV = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.7), accentMat);
    tailV.position.set(0, 0.55, 1.7);
    tailV.castShadow = true;
    plane.add(tailV);

    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.5), bodyMat);
    fin.position.set(0, 0.15, -1.6);
    plane.add(fin);

    // 螺旋桨
    const prop = new THREE.Group();
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.2, 10), darkMat);
    hub.geometry.rotateX(Math.PI / 2);
    const blade = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.04), darkMat);
    prop.add(hub);
    prop.add(blade);
    prop.position.z = -2.7;
    plane.add(prop);

    plane.position.set(0, 160, 0);
    scene.add(plane);

    // ---------- 飞行参数 ----------
    const state = {
      speed: 55,
      cruiseSpeed: 55,
      boostSpeed: 110,
      mouseX: 0,
      mouseY: 0,
      boosting: false,
      yaw: 0,
      pitch: 0,
      roll: 0,
    };
    const MAX_YAW = 0.9;
    const MAX_PITCH = 0.65;

    // ---------- 输入 ----------
    function handlePointer(x, y) {
      state.mouseX = THREE.MathUtils.clamp(x, -1, 1);
      state.mouseY = THREE.MathUtils.clamp(y, -1, 1);
    }
    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      handlePointer(nx, ny);
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length) {
        const t = e.touches[0];
        handlePointer(
          (t.clientX / window.innerWidth) * 2 - 1,
          (t.clientY / window.innerHeight) * 2 - 1
        );
      }
    }, { passive: true });
    window.addEventListener('mouseleave', () => { state.mouseX = 0; state.mouseY = 0; });

    window.addEventListener('mousedown', () => { state.boosting = true; });
    window.addEventListener('mouseup', () => { state.boosting = false; });
    window.addEventListener('touchstart', () => { state.boosting = true; });
    window.addEventListener('touchend', () => { state.boosting = false; });

    // 键盘备用
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') state.boosting = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'Space') state.boosting = false; });

    // ---------- 自适应 ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- 主循环 ----------
    const clock = new THREE.Clock();
    const speedEl = document.getElementById('speed');
    const altEl = document.getElementById('alt');
    const tmpV = new THREE.Vector3();
    const tmpV2 = new THREE.Vector3();

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);

      // 键盘输入叠加
      let mx = state.mouseX;
      let my = state.mouseY;
      if (keys['ArrowLeft'] || keys['KeyA']) mx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) mx += 1;
      if (keys['ArrowUp'] || keys['KeyW']) my += 1;
      if (keys['ArrowDown'] || keys['KeyS']) my -= 1;
      mx = THREE.MathUtils.clamp(mx, -1, 1);
      my = THREE.MathUtils.clamp(my, -1, 1);

      const targetYaw = mx * MAX_YAW;
      const targetPitch = my * MAX_PITCH;
      state.yaw = THREE.MathUtils.lerp(state.yaw, targetYaw, 1 - Math.pow(0.001, dt));
      state.pitch = THREE.MathUtils.lerp(state.pitch, targetPitch, 1 - Math.pow(0.001, dt));

      // 速度平滑
      const targetSpeed = state.boosting ? state.boostSpeed : state.cruiseSpeed;
      state.speed = THREE.MathUtils.lerp(state.speed, targetSpeed, 1 - Math.pow(0.02, dt));

      // 前进方向（-Z 为机头）
      const cp = Math.cos(state.pitch);
      const dir = tmpV.set(
        -Math.sin(state.yaw) * cp,
        Math.sin(state.pitch),
        -Math.cos(state.yaw) * cp
      ).normalize();

      plane.position.addScaledVector(dir, state.speed * dt);

      // 机体朝向：偏航 + 俯仰，并带倾斜（压坡度）
      state.roll = THREE.MathUtils.lerp(state.roll, -mx * 0.7, 1 - Math.pow(0.001, dt));
      plane.rotation.set(state.pitch, state.yaw, state.roll);

      // 高度护栏（避免沉入水面）
      if (plane.position.y < 8) {
        plane.position.y = 8;
        state.pitch = Math.max(state.pitch, 0);
      }

      // 螺旋桨旋转
      prop.rotation.z += state.speed * dt * 1.4;

      // 云朵缓缓漂移
      const t = clock.elapsedTime;
      for (let i = 0; i < clouds.length; i++) {
        clouds[i].rotation.y += dt * 0.004;
      }

      // 海面微浪
      const wpos = waterGeo.attributes.position;
      for (let i = 0; i < wpos.count; i++) {
        const x = wpos.getX(i);
        const z = wpos.getZ(i);
        wpos.setY(i, Math.sin(x * 0.06 + t * 0.6) * 0.5 + Math.cos(z * 0.05 + t * 0.5) * 0.5);
      }
      wpos.needsUpdate = true;
      waterGeo.computeVertexNormals();

      // 相机跟随
      const camOffset = tmpV2.copy(dir).multiplyScalar(-13).add(new THREE.Vector3(0, 3.4, 0));
      camera.position.lerp(
        plane.position.clone().add(camOffset),
        1 - Math.pow(0.0005, dt)
      );
      const lookTarget = plane.position.clone().addScaledVector(dir, 26);
      camera.lookAt(lookTarget);

      // HUD
      speedEl.textContent = Math.round(state.speed * 3.6); // 转成 km/h 观感
      altEl.textContent = Math.round(plane.position.y);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
